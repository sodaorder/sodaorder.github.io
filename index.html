<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>배송지 정보 입력</title>
  <script src="https://t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif; }
    body { background-color: #f3f4f6; margin: 0; padding: 16px; color: #1f2937; display: flex; justify-content: center; }
    .container { background: #ffffff; width: 100%; max-width: 440px; border-radius: 16px; padding: 24px 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
    .header { text-align: center; margin-bottom: 20px; }
    .header h2 { margin: 0 0 6px; font-size: 20px; color: #111827; }
    .header p { margin: 0; font-size: 13px; color: #6b7280; }

    .summary-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px 16px; margin-bottom: 20px; }
    .summary-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 14px; }
    .summary-row:last-child { margin-bottom: 0; border-top: 1px dashed #cbd5e1; padding-top: 10px; margin-top: 8px; font-weight: bold; font-size: 15px; color: #2563eb; }
    .summary-label { color: #64748b; }
    .summary-val { color: #0f172a; font-weight: 600; }

    .bank-card { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 12px; padding: 14px 16px; margin-bottom: 20px; }
    .bank-title { font-size: 13px; font-weight: 700; color: #1d4ed8; margin-bottom: 8px; }
    .bank-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; margin-bottom: 6px; }
    .bank-row:last-child { margin-bottom: 0; }
    .bank-label { color: #475569; }
    .bank-val { font-weight: 700; color: #1e293b; }
    .btn-copy { background: #2563eb; color: #fff; border: none; border-radius: 6px; padding: 4px 10px; font-size: 12px; font-weight: 600; cursor: pointer; margin-left: 8px; }

    .island-notice { display: none; background: #fffbeb; border: 1.5px solid #f59e0b; border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
    .island-notice-title { font-size: 14px; font-weight: 700; color: #b45309; margin-bottom: 6px; }
    .island-notice-desc { font-size: 13px; color: #78350f; line-height: 1.5; word-break: keep-all; }
    .island-notice-total { margin-top: 8px; padding-top: 8px; border-top: 1px dashed #fcd34d; font-size: 14px; font-weight: 700; color: #92400e; display: flex; justify-content: space-between; align-items: center; }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #374151; }
    input[type="text"], input[type="tel"] { width: 100%; padding: 12px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; outline: none; transition: border-color 0.2s; }
    input:focus { border-color: #2563eb; }
    input[readonly] { background-color: #f9fafb; color: #4b5563; }

    .postcode-box { display: flex; gap: 8px; }
    .btn-search { width: 110px; background: #4b5563; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; flex-shrink: 0; }

    .keep-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; }
    .keep-item { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; }
    .keep-item input[type="checkbox"] { width: 18px; height: 18px; margin-top: 2px; flex-shrink: 0; accent-color: #2563eb; cursor: pointer; }
    .keep-text { font-size: 13px; color: #334155; line-height: 1.45; word-break: keep-all; }

    .agree-container { background: #fafafa; border: 1px solid #eee; border-radius: 12px; padding: 14px; margin-top: 20px; margin-bottom: 16px; }
    .agree-item { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; margin-bottom: 12px; }
    .agree-item:last-child { margin-bottom: 0; }
    .agree-item input[type="checkbox"] { width: 18px; height: 18px; margin-top: 2px; flex-shrink: 0; accent-color: #2563eb; cursor: pointer; }
    .agree-text { font-size: 12.5px; color: #4b5563; line-height: 1.45; word-break: keep-all; }
    .agree-tag { color: #ef4444; font-weight: bold; margin-right: 2px; }

    .btn-submit { width: 100%; padding: 15px; background: #2563eb; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 6px; }
    .btn-submit:disabled { background: #93c5fd; cursor: not-allowed; }

    .security-footer { text-align: center; margin-top: 24px; font-size: 11px; color: #9ca3af; line-height: 1.5; border-top: 1px solid #f3f4f6; padding-top: 16px; }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 1000; justify-content: center; align-items: center; }
    .modal-box { background: #fff; width: 85%; max-width: 340px; padding: 22px; border-radius: 16px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
    .modal-text { font-size: 15px; color: #1f2937; margin-bottom: 18px; line-height: 1.45; word-break: keep-all; }
    .modal-btn { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; }

    .loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.85); z-index: 999; justify-content: center; align-items: center; flex-direction: column; }
    .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #2563eb; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .error-box { display: none; background: #fee2e2; border: 1px solid #f87171; color: #991b1b; padding: 16px; border-radius: 12px; text-align: center; font-size: 14px; line-height: 1.5; }
    .success-box { display: none; text-align: center; padding: 26px 10px; }
    .success-icon { font-size: 48px; margin-bottom: 12px; }
  </style>
</head>
<body>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <p style="margin-top: 12px; font-size: 14px; color: #4b5563; font-weight: 600;">처리 중입니다...</p>
  </div>

  <div class="modal-overlay" id="customModal">
    <div class="modal-box">
      <div class="modal-text" id="modalMessage"></div>
      <button type="button" class="modal-btn" onclick="closeModal()">확인</button>
    </div>
  </div>

  <div class="container">
    <div class="error-box" id="errorBox"></div>

    <div id="mainContent" style="display: none;">
      <div class="header">
        <h2>배송지 정보 입력</h2>
        <p>주문자 정보 확인 후 배송지를 입력해 주세요.</p>
      </div>

      <div class="summary-card">
        <div class="summary-row"><span class="summary-label">판매채널</span><span class="summary-val" id="dispChannel">-</span></div>
        <div class="summary-row"><span class="summary-label">닉네임</span><span class="summary-val" id="dispNickname">-</span></div>
        <div class="summary-row"><span class="summary-label">주문수량</span><span class="summary-val" id="dispQty">-</span></div>
        <div class="summary-row"><span class="summary-label">주문금액</span><span class="summary-val" id="dispAmount">-</span></div>
      </div>

      <!-- 1단계: 본인 인증 -->
      <div id="stepAuth">
        <div class="form-group">
          <label for="authCode">본인 인증번호 (휴대폰 번호 뒤 4자리)</label>
          <input type="tel" id="authCode" placeholder="숫자 4자리 입력" maxlength="4" autocomplete="off"
                 oninput="this.value = this.value.replace(/[^0-9]/g, '');"
                 onkeydown="if(event.key==='Enter'){ event.preventDefault(); submitAuth(); }">
        </div>
        <button type="button" class="btn-submit" onclick="submitAuth()">인증 확인</button>
      </div>

      <!-- 2단계: 배송지 입력 폼 -->
      <div id="stepForm" style="display: none;">
        <form id="shippingForm" onsubmit="event.preventDefault(); submitForm();">
          <div class="form-group">
            <label>입금자명 <span style="font-weight:normal; font-size:12px; color:#ef4444;">(닉네임으로 입금해주셔야 빠르게 확인할 수 있어요!)</span></label>
            <input type="text" id="depositorName" required placeholder="입금자명 입력">
          </div>

          <div class="bank-card">
            <div class="bank-title">💳 입금 계좌 안내</div>
            <div class="bank-row"><span class="bank-label">예금주</span><span class="bank-val" id="dispBankOwner">-</span></div>
            <div class="bank-row">
              <span class="bank-label">계좌번호</span>
              <div>
                <span class="bank-val" id="dispAccountNo">-</span>
                <button type="button" class="btn-copy" onclick="copyAccountNo()">복사</button>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label>수령인 성함 <span style="color:red;">*</span></label>
            <input type="text" id="receiverName" required placeholder="수령인 성함 입력">
          </div>

          <div class="form-group">
            <label>연락처 <span style="color:red;">*</span></label>
            <input type="tel" id="phone" required placeholder="010-0000-0000" maxlength="13" oninput="autoHyphen(this)">
          </div>

          <div class="form-group">
            <label>우편번호 <span style="color:red;">*</span></label>
            <div class="postcode-box">
              <input type="text" id="postcode" required readonly placeholder="우편번호">
              <button type="button" class="btn-search" onclick="execDaumPostcode()">주소 검색</button>
            </div>
          </div>

          <div class="form-group">
            <label>기본 주소 <span style="color:red;">*</span></label>
            <input type="text" id="addressBase" required readonly placeholder="우편번호 검색 시 자동 입력">
          </div>

          <div class="form-group">
            <label>상세 주소 <span style="color:red;">*</span></label>
            <input type="text" id="addressDetail" required placeholder="동, 호수 등 상세주소 입력">
          </div>

          <!-- 도서산간 추가운임 안내 박스 (is_combined가 빈값이고 추가운임 >= 1,000원일 때만 노출) -->
          <div class="island-notice" id="islandNoticeBox">
            <div class="island-notice-title">🚚 도서산간 지역 추가운임 안내</div>
            <div class="island-notice-desc" id="islandNoticeDesc"></div>
            <div class="island-notice-total">
              <span>최종 입금하실 금액</span>
              <span id="islandTotalAmount">-</span>
            </div>
          </div>

          <div class="form-group">
            <label>배송 요청사항 <span style="font-weight:normal; font-size:12px; color:#6b7280;">(택배사에 전달하는 내용입니다. 상품 관련 요청은 채널로 문의 주세요.)</span></label>
            <input type="text" id="memo" placeholder="예: 문 앞에 놓아주세요">
          </div>

          <!-- 킵 요청 영역 (추후 도입 시 주석 해제)
          <div class="keep-box">
            <label class="keep-item">
              <input type="checkbox" id="chkKeep">
              <span class="keep-text"><strong>[선택] 합배송(킵) 요청</strong><br>다음 방송 주문건과 함께 묶음 배송을 원하시면 체크해 주세요.</span>
            </label>
          </div>
          -->

          <div class="agree-container">
            <label class="agree-item">
              <input type="checkbox" id="chkPolicy">
              <span class="agree-text">
                <span class="agree-tag">[필수]</span> 모든 상품은 검수 후 출고되나 미세 오염이나 미세 흠집이 있을 수 있으며, 상품 접수 후 교환 및 환불은 채널 운영 정책에 따라 진행됨에 동의합니다.
              </span>
            </label>
            <label class="agree-item">
              <input type="checkbox" id="chkPrivacy">
              <span class="agree-text">
                <span class="agree-tag">[필수]</span> 개인정보 수집 및 이용 동의 (원활한 상품 배송 및 정산 확인을 위해 수령인 정보, 연락처, 주소를 수집합니다.)
              </span>
            </label>
          </div>

          <button type="submit" class="btn-submit" id="btnSubmit">배송지 저장</button>
        </form>
      </div>

      <!-- 3단계: 완료 안내 -->
      <div class="success-box" id="stepSuccess">
        <div class="success-icon">🎉</div>
        <h3 style="margin:0 0 8px; font-size:20px;">제출이 완료되었습니다!</h3>
        <p style="color:#6b7280; font-size:14px; margin:0;">소중한 상품을 안전하게 배송해 드리겠습니다.</p>
      </div>

      <div class="security-footer">
        🔒 고객님의 소중한 개인정보는 SSL/TLS 암호화 통신 및 데이터베이스 보안 정책(AES-256)을 통해 안전하게 보호됩니다.
      </div>
    </div>
  </div>

  <script>
    // =================================================================
    // Supabase 접속 설정 (테스트 서버 / 본 서버 스위칭)
    // =================================================================
    // [1] 테스트 서버 (Soda-dev) - 현재 활성
    // const SUPABASE_URL = "https://dwiljslbixerwmcrtgke.supabase.co";
    // const SUPABASE_ANON_KEY = "sb_publishable_pko30fn1B3IZ0jQ5P6gn0g_55_nVxT2";

    // [2] 운영 본서버 (Soda-prod) - 오픈 시 위 2줄을 주석 처리하고 아래 주석을 해제하세요
    const SUPABASE_URL = "https://ofizamugywdmxklykvvh.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_OKavMnFeMJafiuDVOXpDlA_Kf0HCNgY";

    const urlParams = new URLSearchParams(window.location.search);
    const token = (urlParams.get("t") || "").trim();

    let currentOrder = null;
    let verifiedAuthCode = "";
    let currentExtraFee = 0;

    async function callRpc(fnName, params) {
      const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fnName}`, {
        method: "POST",
        headers: {
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify(params)
      });

      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.message || `서버 오류 (${response.status})`);
      }
      return data;
    }

    function showLoading(show) {
      document.getElementById("loadingOverlay").style.display = show ? "flex" : "none";
    }

    function showModal(msg) {
      document.getElementById("modalMessage").innerHTML = msg;
      document.getElementById("customModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("customModal").style.display = "none";
    }

    function showError(msg) {
      const box = document.getElementById("errorBox");
      box.innerHTML = msg;
      box.style.display = "block";
      document.getElementById("mainContent").style.display = "none";
    }

    function formatNumber(num) {
      return Number(num || 0).toLocaleString("ko-KR");
    }

    function isCombinedEmpty() {
      if (!currentOrder) return true;
      return currentOrder.isCombined === null || currentOrder.isCombined === undefined || currentOrder.isCombined === "";
    }

    // 우편번호 기준 도서산간 추가운임 조회 (is_combined가 빈값일 때만 동작)
    async function updateIslandSurchargeNotice(postcodeVal) {
      const noticeBox = document.getElementById("islandNoticeBox");
      const cleanZip = String(postcodeVal || "").trim();

      if (!isCombinedEmpty() || !cleanZip) {
        currentExtraFee = 0;
        noticeBox.style.display = "none";
        return;
      }

      try {
        const extraFee = await callRpc("calculate_island_surcharge", {
          p_postcode: cleanZip
        });

        const parsedExtra = Number(extraFee) || 0;
        if (parsedExtra >= 1000) {
          currentExtraFee = parsedExtra;
          const baseAmount = Number(currentOrder.amount) || 0;
          const totalAmount = baseAmount + parsedExtra;

          document.getElementById("islandNoticeDesc").innerHTML =
            `선택하신 지역(<strong>${cleanZip}</strong>)은 추가운임 <strong>${formatNumber(parsedExtra)}원</strong>이 발생합니다.<br>` +
            `주문금액과 함께 입금해 주세요.`;
          document.getElementById("islandTotalAmount").textContent = `${formatNumber(totalAmount)}원`;
          noticeBox.style.display = "block";
        } else {
          currentExtraFee = 0;
          noticeBox.style.display = "none";
        }
      } catch (err) {
        console.error("도서산간 조회 오류:", err);
        currentExtraFee = 0;
        noticeBox.style.display = "none";
      }
    }

    // 페이지 로드 시 주문 정보 조회
    window.addEventListener("DOMContentLoaded", async () => {
      if (!token) {
        showError("유효하지 않은 접근입니다.<br>전달받으신 전용 링크로 다시 접속해 주세요.");
        return;
      }

      showLoading(true);
      try {
        const res = await callRpc("get_order_data", { p_token: token });
        if (!res || !res.success) {
          showError(res?.message || "주문 내역을 찾을 수 없습니다.");
          return;
        }

        currentOrder = res.order;
        const bankInfo = res.bankInfo || {};

        if (currentOrder.status === 3 || currentOrder.status === 4) {
          showError("취소된 주문입니다.<br>문의 사항은 구매하신 채널로 연락해 주세요.");
          return;
        }

        if (currentOrder.status >= 5) {
          showError("이미 결제 확인이 완료된 주문입니다.<br>배송지 변경이 필요하시면 구매하신 채널로 문의해 주세요.");
          return;
        }

        document.getElementById("dispChannel").textContent = currentOrder.channelName || "-";
        document.getElementById("dispNickname").textContent = currentOrder.nickname || "-";
        document.getElementById("dispQty").textContent = `${formatNumber(currentOrder.quantity)}개`;
        document.getElementById("dispAmount").textContent = `${formatNumber(currentOrder.amount)}원`;

        document.getElementById("dispBankOwner").textContent = bankInfo.bankOwner || "-";
        document.getElementById("dispAccountNo").textContent = bankInfo.accountNo || "-";
        document.getElementById("depositorName").value = currentOrder.nickname || "";

        document.getElementById("mainContent").style.display = "block";
      } catch (err) {
        showError("주문 정보를 불러오는 중 오류가 발생했습니다.<br>" + err.message);
      } finally {
        showLoading(false);
      }
    });

    // 본인 인증 확인
    async function submitAuth() {
      const code = document.getElementById("authCode").value.trim();
      if (code !== "025" && !/^\d{4}$/.test(code)) {
        showModal("휴대폰 번호 뒤 4자리를 정확히 입력해 주세요.");
        return;
      }

      showLoading(true);
      try {
        const res = await callRpc("verify_order_auth", {
          p_token: token,
          p_auth_code: code
        });

        if (!res || !res.success) {
          showModal(res?.message || "인증 확인에 실패했습니다.");
          return;
        }

        verifiedAuthCode = code;

        if (res.address) {
          const addr = res.address;
          if (addr.depositorName) document.getElementById("depositorName").value = addr.depositorName;
          if (addr.receiverName) document.getElementById("receiverName").value = addr.receiverName;
          if (addr.phone) document.getElementById("phone").value = addr.phone;
          if (addr.postcode) document.getElementById("postcode").value = addr.postcode;
          if (addr.addressBase) document.getElementById("addressBase").value = addr.addressBase;
          if (addr.addressDetail) document.getElementById("addressDetail").value = addr.addressDetail;
          if (addr.memo) document.getElementById("memo").value = addr.memo;

          // 이전 주소가 불러와졌고 is_combined가 빈값이라면 도서산간 여부 즉시 확인
          if (addr.postcode) {
            await updateIslandSurchargeNotice(addr.postcode);
          }
        }

        document.getElementById("stepAuth").style.display = "none";
        document.getElementById("stepForm").style.display = "block";
      } catch (err) {
        showModal("인증 처리 중 오류가 발생했습니다.<br>" + err.message);
      } finally {
        showLoading(false);
      }
    }

    // 다음(카카오) 우편번호 검색
    function execDaumPostcode() {
      new daum.Postcode({
        oncomplete: async function(data) {
          const roadAddr = data.roadAddress;
          const jibunAddr = data.jibunAddress;
          const selectedAddr = roadAddr || jibunAddr || "";

          document.getElementById("postcode").value = data.zonecode;
          document.getElementById("addressBase").value = selectedAddr;
          document.getElementById("addressDetail").focus();

          // 우편번호 확정 직후 도서산간 추가운임 조회
          await updateIslandSurchargeNotice(data.zonecode);
        }
      }).open();
    }

    // 배송지 최종 제출
    async function submitForm() {
      const depositorName = document.getElementById("depositorName").value.trim();
      const receiverName = document.getElementById("receiverName").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const postcode = document.getElementById("postcode").value.trim();
      const addressBase = document.getElementById("addressBase").value.trim();
      const addressDetail = document.getElementById("addressDetail").value.trim();
      const memo = document.getElementById("memo").value.trim();
      const isKeepRequested = 0; // 킵 요청 기능 비활성화 상태 (추후 도입 시 활성화)

      if (!depositorName || !receiverName || !phone || !postcode || !addressBase || !addressDetail) {
        showModal("필수 입력 항목을 모두 작성해 주세요.");
        return;
      }

      if (!document.getElementById("chkPolicy").checked || !document.getElementById("chkPrivacy").checked) {
        showModal("필수 약관에 모두 동의해 주세요.");
        return;
      }

      const btn = document.getElementById("btnSubmit");
      btn.disabled = true;
      showLoading(true);

      try {
        const res = await callRpc("save_order_shipping", {
          p_token: token,
          p_nickname: currentOrder.nickname,
          p_auth_code: verifiedAuthCode,
          p_depositor_name: depositorName,
          p_receiver_name: receiverName,
          p_phone: phone,
          p_postcode: postcode,
          p_address_main: addressBase,
          p_address_detail: addressDetail,
          p_memo: memo,
          p_is_keep_requested: isKeepRequested
        });

        if (!res || !res.success) {
          showModal(res?.message || "저장에 실패했습니다.");
          btn.disabled = false;
          return;
        }

        document.getElementById("stepForm").style.display = "none";
        document.getElementById("stepSuccess").style.display = "block";
      } catch (err) {
        showModal("저장 중 오류가 발생했습니다.<br>" + err.message);
        btn.disabled = false;
      } finally {
        showLoading(false);
      }
    }

    function autoHyphen(target) {
      target.value = target.value
        .replace(/[^0-9]/g, "")
        .replace(/^(\d{2,3})(\d{3,4})(\d{4})$/, "$1-$2-$3");
    }

    function copyAccountNo() {
      const acc = document.getElementById("dispAccountNo").textContent.trim();
      if (!acc || acc === "-") return;
      navigator.clipboard.writeText(acc).then(() => {
        showModal("계좌번호가 복사되었습니다.<br><strong>" + acc + "</strong>");
      }).catch(() => {
        showModal("계좌번호: <strong>" + acc + "</strong>");
      });
    }
  </script>
</body>
